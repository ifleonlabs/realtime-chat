<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>realtime-chat</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- Join screen -->
  <div id="join" class="join">
    <form id="join-form" class="card">
      <h1>💬 realtime-chat</h1>
      <p class="subtitle">Pick a name and a room to start chatting</p>
      <input type="text" id="username" placeholder="Your name" required autocomplete="off" />
      <input type="text" id="room" placeholder="Room (e.g. general)" value="general" autocomplete="off" />
      <button type="submit">Join</button>
    </form>
  </div>

  <!-- Chat screen -->
  <div id="chat" class="chat" hidden>
    <header class="chat-header">
      <div>
        <strong id="room-name"></strong>
        <span id="status" class="status">connecting…</span>
      </div>
      <button id="leave-btn" class="ghost">Leave</button>
    </header>

    <div class="chat-body">
      <main id="messages" class="messages"></main>
      <aside class="presence">
        <h3>Online · <span id="online-count">0</span></h3>
        <ul id="user-list"></ul>
      </aside>
    </div>

    <form id="message-form" class="message-form">
      <input type="text" id="message-input" placeholder="Type a message…" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
